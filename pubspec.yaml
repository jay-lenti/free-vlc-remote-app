name: vlc_remote
description: A simple, lightweight VLC remote controller for Android and iOS.
version: 1.0.0+1
homepage: https://github.com/jay-lenti/free-vlc-remote-app
repository: https://github.com/jay-lenti/free-vlc-remote-app
issue_tracker: https://github.com/jay-lenti/free-vlc-remote-app/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.1
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/app_icon.png
  android_12:
    image: assets/app_icon.png
    color: "#ffffff"
  web: false

flutter:
  uses-material-design: true
